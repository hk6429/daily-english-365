<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>全部情境 — 英語日日聽</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>英語<span>日日</span>聽</h1>
    <nav><a href="./">回今天</a></nav>
  </header>
  <p class="hint">365 個情境依主題分組，點任一張卡片即可練習。每天輪到不同主題，「第 N 天」是它在一年中出現的日子；紅框＝已完成。</p>
  <div id="groups"></div>
</div>
<script type="module">
import { todayIndex, buildOrder, dayOfScene } from './js/day.js';
import { bgFor, setPageBg } from './js/cats.js';
import { loadDone, isDoneScene } from './js/progress.js';
setPageBg('bg/generic.webp');
const scenes = await (await fetch('data/scenes.json')).json();
const order = buildOrder(scenes);
const today = todayIndex();
const done = loadDone();
const groups = new Map();
for (const x of scenes) { if (!groups.has(x.category)) groups.set(x.category, []); groups.get(x.category).push(x); }
const root = document.getElementById('groups');
for (const [cat, list] of groups) {
  const g = document.createElement('section'); g.className = 'group';
  g.innerHTML = `<div class="banner"><h3>${cat}<small>${list.length} 個情境</small></h3></div><div class="grid"></div>`;
  g.querySelector('.banner').style.backgroundImage = `url("${bgFor(cat)}")`;
  const grid = g.querySelector('.grid');
  for (const x of list) {
    const day = dayOfScene(order, x.id);
    const a = document.createElement('a'); a.href = `./?d=${day}`;
    a.className = (day === today ? 'today ' : '') + (isDoneScene(done, x.id) ? 'is-done' : '');
    const id3 = String(x.id).padStart(3, '0');
    a.innerHTML = `<span class="thumb"><img loading="lazy" alt="" src="img/${id3}.webp" onerror="this.parentNode.classList.add('missing');this.remove()"></span><span class="txt"><small>第 ${day} 天</small><b></b><i></i></span>`;
    a.querySelector('b').textContent = x.title_zh; a.querySelector('i').textContent = x.title_en;
    grid.appendChild(a);
  }
  root.appendChild(g);
}
</script>
<script src="js/vendor/gc-config.js"></script>
<script async src="js/vendor/count.js"></script>
</body>
</html>
