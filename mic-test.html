<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>麥克風檢測 — 英語日日聽</title>
<style>
body{font:16px/1.5 -apple-system,system-ui,sans-serif;margin:0;padding:16px;background:#faf7f0;color:#1c1c1c}
h1{font-size:20px;margin:0 0 4px}p{margin:4px 0 12px}
.say{font-size:20px;font-weight:700;background:#fff;padding:10px;border-radius:10px;margin-bottom:12px}
button{display:block;width:100%;min-height:48px;margin:8px 0;border-radius:10px;border:1px solid #2c3e6b;background:#2c3e6b;color:#fff;font-size:16px;font-weight:700}
button:disabled{opacity:.4}
#log{white-space:pre-wrap;font:13px/1.4 ui-monospace,monospace;background:#fff;border:1px solid #ddd;border-radius:10px;padding:10px;min-height:120px}
</style>
</head>
<body>
<h1>麥克風檢測</h1>
<p><b>第二輪：</b>每測一項之前，先按網址列的 ↻ 重新整理，再按按鈕。原音播完、看到「● 現在請念」再念下面這句。三項各錄一段畫面（或截圖）傳給大乃老師。</p>
<div class="say">Can I get a coffee, please?</div>
<button data-t="6">測試 A：原音（現行播放器）播完「釋放」後再辨識</button>
<button data-t="7">測試 B：原音改用 Web Audio 播，播完再辨識</button>
<button data-t="8">測試 C：Web Audio 邊播原音邊辨識</button>
<button data-t="9">測試 D：Web Audio 播完後量音量</button>
<div id="log"></div>
<script>
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const logEl = document.getElementById('log');
const log = s => { logEl.textContent += s + '\n'; };
log('UA: ' + navigator.userAgent);
log('辨識 API: ' + (SR ? '有' : '無') + '　AudioContext: ' + (window.AudioContext || window.webkitAudioContext ? '有' : '無'));
const AUDIO = 'audio/001-1.mp3';
const player = new Audio();

function runSR(tag, continuous, ms) {
  return new Promise(res => {
    if (!SR) { log(tag + ' 無辨識 API'); return res(); }
    const t0 = performance.now(); const at = () => Math.round(performance.now() - t0) + 'ms';
    const r = new SR(); r.lang = 'en-US'; r.continuous = continuous; r.interimResults = continuous; r.maxAlternatives = 1;
    let got = '', ended = false;
    ['start', 'audiostart', 'soundstart', 'speechstart', 'speechend', 'audioend'].forEach(ev => r.addEventListener(ev, () => log(`${tag} ${at()} ${ev}`)));
    r.onresult = e => { got = Array.from(e.results).map(x => x[0].transcript + (x.isFinal ? '[final]' : '')).join(' | '); log(`${tag} ${at()} result: ${got}`); };
    r.onerror = e => log(`${tag} ${at()} ERROR: ${e.error}`);
    r.onend = () => { ended = true; log(`${tag} ${at()} end。最後結果：「${got}」`); res(); };
    const stopT = setTimeout(() => { log(`${tag} ${at()} 呼叫 stop()`); try { r.stop(); } catch (e) { log(tag + ' stop 例外 ' + e); } }, ms);
    setTimeout(() => { if (!ended) { log(`${tag} ${at()} 15 秒仍未 end（卡住）`); try { r.abort(); } catch {} res(); } }, 15000);
    try { r.start(); log(`${tag} ${at()} start() 已呼叫`); } catch (e) { clearTimeout(stopT); log(`${tag} start 例外 ${e}`); res(); }
  });
}
function play() {
  return new Promise(res => {
    player.onended = () => { log('原音 ended'); res(); };
    player.onpause = () => log('原音 pause');
    player.onerror = () => { log('原音 error'); res(); };
    player.src = AUDIO; player.play().then(() => log('原音開始播'), e => { log('原音 play 失敗 ' + e); res(); });
    setTimeout(res, 8000);
  });
}
async function volume(tag, ms) {
  const AC = window.AudioContext || window.webkitAudioContext;
  let s; try { s = await navigator.mediaDevices.getUserMedia({ audio: true }); } catch (e) { log(tag + ' getUserMedia 失敗 ' + e.name); return; }
  const ctx = new AC(); log(tag + ' ctx 建立後 state=' + ctx.state);
  try { await ctx.resume(); } catch (e) { log(tag + ' resume 失敗 ' + e); }
  log(tag + ' resume 後 state=' + ctx.state);
  const src = ctx.createMediaStreamSource(s), an = ctx.createAnalyser(); an.fftSize = 1024; src.connect(an);
  const buf = new Float32Array(an.fftSize); let peak = 0, voiced = 0, last = performance.now(); const end = last + ms;
  await new Promise(res => { const tick = () => { const now = performance.now(); an.getFloatTimeDomainData(buf); let sum = 0; for (const v of buf) sum += v * v; const rms = Math.sqrt(sum / buf.length); peak = Math.max(peak, rms); if (rms > 0.02) voiced += now - last; last = now; now < end ? setTimeout(tick, 50) : res(); }; tick(); });
  log(`${tag} 峰值 RMS=${peak.toFixed(4)}　超過門檻 ${Math.round(voiced)}ms`);
  s.getTracks().forEach(t => t.stop()); ctx.close();
}
let actx = null;
function webAudioPlay() {
  return new Promise(async res => {
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      actx = actx || new AC(); await actx.resume();
      const buf = await actx.decodeAudioData(await (await fetch(AUDIO)).arrayBuffer());
      const src = actx.createBufferSource(); src.buffer = buf; src.connect(actx.destination);
      src.onended = () => { log('WebAudio 原音 ended'); res(); };
      src.start(0); log('WebAudio 原音開始播（ctx ' + actx.state + '）');
    } catch (e) { log('WebAudio 失敗 ' + e); res(); }
  });
}
const now = () => log('● 現在請念');
const tests = {
  6: async () => { await play(); player.pause(); player.removeAttribute('src'); player.load(); log('播放器已釋放'); now(); await runSR('[A]', true, 6000); },
  7: async () => { await webAudioPlay(); now(); await runSR('[B]', true, 6000); },
  8: async () => { now(); await Promise.all([webAudioPlay(), runSR('[C]', true, 6000)]); },
  9: async () => { await webAudioPlay(); now(); await volume('[D]', 5000); },
  1: () => runSR('[1]', false, 6000),
  2: () => runSR('[2]', true, 5000),
  3: async () => { await play(); await runSR('[3]', false, 6000); },
  4: () => Promise.all([play(), runSR('[4]', true, 5000)]),
  5: () => volume('[5]', 5000),
};
document.querySelectorAll('button').forEach(b => b.onclick = async () => {
  document.querySelectorAll('button').forEach(x => x.disabled = true);
  log('── ' + b.textContent + ' ──');
  try { await tests[b.dataset.t](); } catch (e) { log('例外 ' + e); }
  document.querySelectorAll('button').forEach(x => x.disabled = false);
});
</script>
</body>
</html>
